name: Qualidade e seguranca - BI SNP 360
on:
  push:
    branches: [main, 'dev/**', 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_assets.py
      - run: python scripts/release_guard.py
      - run: node --check web/assets/app.js
      - run: pytest -q
