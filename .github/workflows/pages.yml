name: BI SNP 360 - GitHub Pages (somente demonstração)
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/release_guard.py'
      - 'scripts/validate_assets.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validação e isolamento de dados
        run: |
          python scripts/validate_assets.py
          python scripts/release_guard.py
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("web")
          assert (root / "index.html").exists()
          assert (root / ".nojekyll").exists()
          data=json.loads((root / "data/demo_public.json").read_text(encoding="utf-8"))
          assert data["metadata"]["environment"] == "DEMONSTRACAO"
          assert data["metadata"]["synthetic"] is True
          assert sorted(str(p.relative_to(root)) for p in (root/"data").rglob("*") if p.is_file()) == ["data/demo_public.json"]
          allowed={".html",".css",".js",".json",".svg"}
          for p in root.rglob("*"):
              if p.is_symlink():
                  raise RuntimeError(f"Link simbólico proibido: {p}")
              if p.is_file() and p.name!=".nojekyll" and p.suffix.lower() not in allowed:
                  raise RuntimeError(f"Arquivo não público no Pages: {p}")
          print("OK: Pages contém exclusivamente o frontend demonstrativo (web/).")
          PY
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Empacotar somente web
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
