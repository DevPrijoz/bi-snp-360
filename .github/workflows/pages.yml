name: Publicar demonstracao estatica - GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar dados exclusivamente demonstrativos
        run: |
          python scripts/validate_assets.py
          python scripts/release_guard.py
      - name: Instrucoes de ativacao do Pages
        run: |
          echo 'GitHub Pages precisa estar habilitado em Settings > Pages > Source: GitHub Actions.'
          echo 'Se a conta usa GitHub Free e este repositório é privado, o Pages pode não estar disponível.'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - id: deployment
        uses: actions/deploy-pages@v4
