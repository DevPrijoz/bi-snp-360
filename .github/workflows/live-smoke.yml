name: Verificação HTTPS da demonstração
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '10 12 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_live_demo.py
